[project]
name = "einkrelayer"
version = "0.1.0"
readme = "README.md"
description = "Prepare readable web pages and documents as ebooks and deliver them by SMTP"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "pillow>=11,<13",
  "cairosvg>=2.7,<3",
  "python-dotenv>=1,<2",
  "pymupdf>=1.25,<2",
  "tinycss2>=1.4,<2",
  "markdown-it-py>=3,<5",
  "ziamath>=0.13,<1",
  "mammoth>=1.13,<2",
  "lxml>=6,<7",
  "dkimpy>=1.1,<2",
  "dnspython>=2.6,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
einkrelayer = "einkrelayer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["einkrelayer"]

[dependency-groups]
dev = [
    "python-docx>=1.2,<2",
    "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
